name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($ver -ne $cargo) { throw "Tag $ver does not match Cargo.toml version $cargo" }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          $ver = "${{ github.ref_name }}"
          $name = "advanced_taskmanager-$ver-windows-x64"
          New-Item -ItemType Directory -Force dist, "pkg/$name" | Out-Null
          Copy-Item target/release/advanced_taskmanager.exe dist/
          Copy-Item target/release/advanced_taskmanager.exe, LICENSE, README.md, THIRD_PARTY_NOTICES.md, CHANGELOG.md "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "dist/$name.zip"
          Push-Location dist
          Get-ChildItem -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt
          Pop-Location
          Get-Content dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$ver]").LineNumber
          if (-not $start) { throw "No CHANGELOG section for $ver" }
          $body = $lines[$start..($lines.Count - 1)]
          $end = ($body | Select-String -Pattern '^## \[|^\[[^\]]+\]: ' | Select-Object -First 1).LineNumber
          if ($end) { $body = $body[0..($end - 2)] }
          $body + @(
            "",
            "## Download",
            "",
            "- **advanced_taskmanager.exe**: the program on its own. There's nothing to install; just run it.",
            "- **advanced_taskmanager-${{ github.ref_name }}-windows-x64.zip**: the program with its licence, README, third-party notices and changelog.",
            "- **SHA256SUMS.txt**: checksums to verify the downloads.",
            "",
            "Requires Windows 10 (1809+) or Windows 11, 64-bit."
          ) | Set-Content notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* `
            --title "Advanced TaskManager ${{ github.ref_name }}" `
            --notes-file notes.md `
            --verify-tag
